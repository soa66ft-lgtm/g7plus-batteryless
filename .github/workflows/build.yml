name: Build G7 Plus batteryless kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            wget \
            xz-utils \
            cpio

      - name: Download kernel source
        run: |
          git clone \
            --depth=1 \
            --branch lineage-22.2 \
            https://github.com/LineageOS/android_kernel_motorola_msm8998.git \
            kernel

      - name: Apply batteryless patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("kernel/drivers/power/supply/qcom/qpnp-fg-gen3.c")
          s = p.read_text()

          old1 = '''out:
          	ret = fg_batt_missing_config(chip, true);
          	if (ret < 0) {
          		pr_err("Error in enabling BMD, ret=%d\\n", ret);
          		return ret;
          	}

          	vote(chip->batt_miss_irq_en_votable, BATT_MISS_IRQ_VOTER, true, 0);
          	return rc;
          }'''

          new1 = '''out:
          	/* Batteryless mode: keep battery-missing detection disabled. */
          	ret = fg_batt_missing_config(chip, false);
          	if (ret < 0) {
          		pr_err("Error keeping BMD disabled, ret=%d\\n", ret);
          		return ret;
          	}

          	vote(chip->batt_miss_irq_en_votable,
          		BATT_MISS_IRQ_VOTER, false, 0);

          	chip->battery_missing = false;

          	return rc;
          }'''

          old2 = '''static irqreturn_t fg_batt_missing_irq_handler(int irq, void *data)
          {
          	struct fg_chip *chip = data;
          	u8 status;
          	int rc;

          	rc = fg_read(chip, BATT_INFO_INT_RT_STS(chip), &status, 1);
          	if (rc < 0) {
          		pr_err("failed to read addr=0x%04x, rc=%d\\n",
          			BATT_INFO_INT_RT_STS(chip), rc);
          		return IRQ_HANDLED;
          	}

          	fg_dbg(chip, FG_IRQ, "irq %d triggered sts:%d\\n", irq, status);
          	chip->battery_missing = (status & BT_MISS_BIT);

          	if (chip->battery_missing) {
          		chip->profile_available = false;
          		chip->profile_loaded = false;
          		chip->soc_reporting_ready = false;
          		return IRQ_HANDLED;
          	}

          	clear_battery_profile(chip);
          	schedule_delayed_work(&chip->profile_load_work, 0);

          	if (chip->fg_psy)
          		power_supply_changed(chip->fg_psy);

          	return IRQ_HANDLED;
          }'''

          new2 = '''static irqreturn_t fg_batt_missing_irq_handler(int irq, void *data)
          {
          	struct fg_chip *chip = data;

          	/*
          	 * Batteryless mode for Motorola lake.
          	 * Ignore BATT_MISSING and keep battery profile active.
          	 */
          	chip->battery_missing = false;

          	if (chip->fg_psy)
          		power_supply_changed(chip->fg_psy);

          	return IRQ_HANDLED;
          }'''

          for name, old, new in [
              ("disable BMD", old1, new1),
              ("ignore battery missing IRQ", old2, new2),
          ]:
              if old not in s:
                  raise SystemExit(
                      "ERROR: source block not found: " + name
                  )

              s = s.replace(old, new, 1)
              print("PATCH OK:", name)

          p.write_text(s)

          print("BATTERYLESS PATCH APPLIED")
          PY

      - name: Fix vdso32 ARM tools
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("kernel/arch/arm64/kernel/vdso32/Makefile")
          s = p.read_text()

          old = '''# Strip rule for vdso.so
          $(obj)/vdso.so: OBJCOPYFLAGS := -S
          $(obj)/vdso.so: $(obj)/vdso.so.dbg FORCE
          	$(call if_changed,objcopy)
          '''

          new = '''# Strip rule for vdso.so
          # vdso32 is AArch32. Use ARM32 objcopy explicitly.
          $(obj)/vdso.so: OBJCOPY := $(CROSS_COMPILE_ARM32)objcopy
          $(obj)/vdso.so: OBJCOPYFLAGS := -S
          $(obj)/vdso.so: $(obj)/vdso.so.dbg FORCE
          	$(call if_changed,objcopy)
          '''

          if old not in s:
              raise SystemExit(
                  "ERROR: vdso32 objcopy block not found"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("VDSO32 OBJCOPY FIX APPLIED")
          PY

      - name: Download toolchains
        run: |
          mkdir -p \
            toolchains/clang \
            toolchains/gcc64 \
            toolchains/gcc32

          echo "Downloading Clang..."

          wget -q -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"

          tar -xzf clang.tar.gz \
            -C toolchains/clang

          echo "Downloading ARM64 binutils..."

          wget -q -O gcc64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"

          tar -xzf gcc64.tar.gz \
            -C toolchains/gcc64

          echo "Downloading ARM32 binutils..."

          wget -q -O gcc32.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"

          tar -xzf gcc32.tar.gz \
            -C toolchains/gcc32

          echo "===== CHECKING TOOLS ====="

          test -x toolchains/clang/bin/clang

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-ld.bfd

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-objcopy

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-ld.bfd

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-objcopy

          echo "Clang:"
          toolchains/clang/bin/clang --version

          echo "ARM32 BFD linker:"
          toolchains/gcc32/bin/arm-linux-androideabi-ld.bfd \
            --version | head -n 1

          echo "ARM32 objcopy:"
          toolchains/gcc32/bin/arm-linux-androideabi-objcopy \
            --version | head -n 1

          echo "ALL TOOLS FOUND"

      - name: Configure kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD_ARM32=arm-linux-androideabi-ld.bfd \
            lineageos_lake_defconfig

      - name: Verify ARM32 VDSO toolchain
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          echo "===== ARM32 BFD LINKER ====="
          which arm-linux-androideabi-ld.bfd
          arm-linux-androideabi-ld.bfd --version | head -n 3

          echo "===== ARM32 OBJCOPY ====="
          which arm-linux-androideabi-objcopy
          arm-linux-androideabi-objcopy --version | head -n 3

          echo "===== CONFIG ====="
          grep CONFIG_COMPAT "$GITHUB_WORKSPACE/out/.config" || true
          grep CONFIG_COMPAT_VDSO "$GITHUB_WORKSPACE/out/.config" || true

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"

          make -C kernel \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            DTC_EXT=dtc \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD_ARM32=arm-linux-androideabi-ld.bfd

      - name: Collect outputs
        run: |
          mkdir -p artifact

          echo "===== GENERATED FILES ====="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print

          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ERROR: Image.gz-dtb was not generated"
            exit 1
          fi

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifact/Image.gz-dtb

          cp \
            out/.config \
            artifact/kernel.config

          sha256sum \
            artifact/Image.gz-dtb \
            artifact/kernel.config \
            > artifact/SHA256SUMS.txt

          echo "===== RESULT ====="
          ls -lh artifact/

      - name: Upload compiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: g7plus-lake-batteryless-kernel
          path: artifact/
          if-no-files-found: error
